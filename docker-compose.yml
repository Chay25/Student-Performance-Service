services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-student_predictions}
      POSTGRES_USER: ${DB_USER:-student_app}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-local-dev-password-change-me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 15
  model-service:
    build: ./model-service
    environment:
      MODEL_PATH: /app/artifacts/xgboost.json
    volumes:
      - model_artifacts:/app/artifacts
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health',timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 30s
  java-api:
    build: ./java-api
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${DB_NAME:-student_predictions}
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-student_app}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-local-dev-password-change-me}
      APP_API_KEY: ${API_KEY:-dev-only-change-me}
      APP_MODEL_URL: http://model-service:8000
    depends_on:
      db:
        condition: service_healthy
      model-service:
        condition: service_healthy
volumes:
  postgres_data:
  model_artifacts:
